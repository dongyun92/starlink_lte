<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULG → TXT 변환기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1d2e;
      border: 1px solid #2d3150;
      border-radius: 16px;
      padding: 48px 56px;
      width: 520px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #f1f5f9;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 36px;
    }

    /* 드래그앤드롭 영역 */
    .drop-zone {
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #0f1117;
      margin-bottom: 28px;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #6366f1;
      background: rgba(99,102,241,0.06);
    }
    .drop-zone .icon { font-size: 36px; margin-bottom: 12px; }
    .drop-zone .label {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .drop-zone .label span {
      color: #6366f1;
      font-weight: 600;
      cursor: pointer;
    }
    .drop-zone .hint { font-size: 12px; color: #475569; }
    .drop-zone.has-file { border-color: #22c55e; background: rgba(34,197,94,0.05); }
    .drop-zone.has-file .icon-area .icon { display: none; }

    /* 파일명 표시 */
    .file-info {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(34,197,94,0.1);
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .file-info.visible { display: flex; }
    .file-icon { font-size: 24px; }
    .file-name { font-size: 14px; font-weight: 500; color: #86efac; }
    .file-size { font-size: 12px; color: #4ade80; opacity: 0.7; }
    .file-remove {
      margin-left: auto;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .file-remove:hover { background: rgba(239,68,68,0.15); color: #f87171; }

    /* 변환 버튼 */
    .btn-convert {
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-convert:hover:not(:disabled) { background: #4f46e5; transform: translateY(-1px); }
    .btn-convert:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }

    /* 진행 상태 */
    .status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .status.loading  { display: flex; background: rgba(99,102,241,0.1); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.2); }
    .status.success  { display: flex; background: rgba(34,197,94,0.1);  color: #86efac; border: 1px solid rgba(34,197,94,0.2); }
    .status.error    { display: flex; background: rgba(239,68,68,0.1);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(165,180,252,0.3);
      border-top-color: #a5b4fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 출력 포맷 안내 */
    .format-info {
      margin-top: 28px;
      padding: 16px;
      background: #0f1117;
      border-radius: 8px;
      border: 1px solid #1e2540;
    }
    .format-info .fmt-title {
      font-size: 11px;
      color: #475569;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .fields {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .field-tag {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .field-tag.ok  { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .field-tag.na  { background: rgba(100,116,139,0.15); color: #64748b; }

    input[type="file"] { display: none; }

    .nav-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
      text-decoration: none;
    }
    .nav-link:hover { color: #6366f1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✈️ ULG → TXT 변환기</h1>
    <p class="subtitle">PX4 비행 로그를 비행시험 데이터 양식(TXT)으로 변환합니다</p>

    <!-- 드래그앤드롭 영역 -->
    <div class="drop-zone" id="dropZone">
      <div class="icon">📂</div>
      <div class="label">
        파일을 여기에 끌어다 놓거나 <span onclick="document.getElementById('fileInput').click()">클릭하여 선택</span>
      </div>
      <div class="hint">.ulg 파일만 지원</div>
    </div>

    <input type="file" id="fileInput" accept=".ulg">

    <!-- 선택된 파일 정보 -->
    <div class="file-info" id="fileInfo">
      <span class="file-icon">📋</span>
      <div>
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>
      <button class="file-remove" id="fileRemove" title="제거">✕</button>
    </div>

    <!-- 변환 버튼 -->
    <button class="btn-convert" id="convertBtn" disabled>
      <span>🔄</span>
      <span>TXT로 변환하기</span>
    </button>

    <!-- 상태 메시지 -->
    <div class="status" id="statusMsg">
      <div class="spinner" id="spinner"></div>
      <span id="statusText"></span>
    </div>

    <!-- 출력 필드 안내 -->
    <div class="format-info">
      <div class="fmt-title">출력 필드</div>
      <div class="fields">
        <span class="field-tag ok">Time</span>
        <span class="field-tag ok">UTM-X</span>
        <span class="field-tag ok">UTM-Y</span>
        <span class="field-tag ok">UTM-Z</span>
        <span class="field-tag ok">Alt.</span>
        <span class="field-tag ok">TrueAirspeed</span>
        <span class="field-tag ok">Ps</span>
        <span class="field-tag ok">Pd</span>
        <span class="field-tag na">AOA (0)</span>
        <span class="field-tag na">AOS (0)</span>
        <span class="field-tag ok">Roll</span>
        <span class="field-tag ok">Pitch</span>
        <span class="field-tag ok">Yaw</span>
        <span class="field-tag ok">P</span>
        <span class="field-tag ok">Q</span>
        <span class="field-tag ok">R</span>
      </div>
      <div style="margin-top:8px; font-size:11px; color:#475569;">
        AOA/AOS: 센서 미장착으로 0 출력 &nbsp;|&nbsp; 좌표계: WGS84 → UTM
      </div>
    </div>

    <a class="nav-link" href="/">← 분석 플랫폼으로 돌아가기</a>
  </div>

  <script>
    const dropZone   = document.getElementById('dropZone');
    const fileInput  = document.getElementById('fileInput');
    const fileInfo   = document.getElementById('fileInfo');
    const fileName   = document.getElementById('fileName');
    const fileSize   = document.getElementById('fileSize');
    const fileRemove = document.getElementById('fileRemove');
    const convertBtn = document.getElementById('convertBtn');
    const statusMsg  = document.getElementById('statusMsg');
    const statusText = document.getElementById('statusText');
    const spinner    = document.getElementById('spinner');

    let selectedFile = null;

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
      return (b/1024/1024).toFixed(1) + ' MB';
    }

    function setFile(file) {
      if (!file || !file.name.endsWith('.ulg')) {
        showStatus('error', '.ulg 파일만 지원합니다');
        return;
      }
      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = formatBytes(file.size);
      fileInfo.classList.add('visible');
      dropZone.classList.add('has-file');
      convertBtn.disabled = false;
      hideStatus();
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = '';
      fileInfo.classList.remove('visible');
      dropZone.classList.remove('has-file');
      convertBtn.disabled = true;
      hideStatus();
    }

    function showStatus(type, msg) {
      statusMsg.className = 'status ' + type;
      statusText.textContent = msg;
      spinner.style.display = (type === 'loading') ? 'block' : 'none';
    }
    function hideStatus() {
      statusMsg.className = 'status';
    }

    // 드래그앤드롭
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      setFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
    fileRemove.addEventListener('click', clearFile);

    // 변환 실행
    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      convertBtn.disabled = true;
      showStatus('loading', '변환 중입니다... ULG 파싱 및 UTM 변환 중');

      const form = new FormData();
      form.append('file', selectedFile);

      try {
        const res = await fetch('/converter/convert', { method: 'POST', body: form });

        if (!res.ok) {
          const err = await res.json();
          showStatus('error', '오류: ' + (err.error || '알 수 없는 오류'));
          convertBtn.disabled = false;
          return;
        }

        // 파일 다운로드
        const blob = await res.blob();
        const outName = selectedFile.name.replace('.ulg', '.txt');
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = outName;
        a.click();
        URL.revokeObjectURL(url);

        showStatus('success', `✅ 변환 완료 → ${outName} 다운로드됨`);
      } catch (e) {
        showStatus('error', '네트워크 오류: ' + e.message);
      }

      convertBtn.disabled = false;
    });
  </script>
</body>
</html>
